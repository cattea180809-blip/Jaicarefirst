<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>JaiCare - Home</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        html, body {
            width: 100%;
            height: 100%;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            overflow: hidden;
            min-height: 100vh;
            background-color: #f7f9ff;
        }

        /* background image */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            filter: saturate(1.05) contrast(1.03);
            opacity: 0.95;
        }

        /* content container - ปรับตำแหน่งปุ่มขึ้นบนและขยับซ้าย */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            width: 50%;
            padding: 0;
            margin-top: 60px; /* ขยับขึ้นบน (จากเดิม 180px) */
            margin-right: 5vw; /* ขยับไปทางซ้ายเพื่อตรงกลาง JaiCare */
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* hero content wrapper */
        .hero-content {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* Get Started Button */
        .get-started-btn {
            padding: 14px 36px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #5fe3ff 100%);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.22s ease, box-shadow 0.22s ease, opacity 0.2s;
            box-shadow: 0 12px 28px rgba(102, 126, 234, 0.28);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            z-index: 2;
            min-width: 170px;
        }

        /* ripple/glow effect on hover */
        .get-started-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease, opacity 0.3s;
            z-index: 0;
        }

        .get-started-btn:hover::before {
            width: 340px;
            height: 340px;
            opacity: 0.9;
        }

        .get-started-btn:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(60,100,200,0.28);
        }

        .get-started-btn:active {
            transform: translateY(-2px);
        }

        .button-text {
            position: relative;
            z-index: 1;
            display: inline-block;
        }

        /* Loading animation */
        .get-started-btn.loading {
            pointer-events: none;
            opacity: 0.85;
        }

        .get-started-btn.loading .button-text {
            display: none;
        }

        .spinner {
            display: none;
            position: relative;
            z-index: 1;
            width: 20px;
            height: 20px;
            margin: 0;
        }

        .get-started-btn.loading .spinner {
            display: block;
        }

        .spinner::after {
            content: '';
            display: block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid white;
            border-color: white transparent white transparent;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Fade out animation when transitioning */
        body.transition-out {
            animation: fadeOut 0.6s ease-out forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Navigation Links */
        .nav-links {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2;
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: #888;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.3s;
            opacity: 0.95;
        }

        .nav-links a:hover {
            color: #667eea;
        }

        /* Responsive tweaks */
        @media (max-width: 1024px) {
            .container { 
                width: 60%;
                margin-top: 40px;
                margin-right: 2vw;
            }
        }

        @media (max-width: 768px) {
            body {
                justify-content: center;
            }
            .container { 
                width: 100%;
                margin-top: 20px;
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Background Image -->
    <div class="bg-image" id="bgImage" aria-hidden="true"></div>

    <!-- Navigation Links -->
    <div class="nav-links">
        <a href="index.html">Login</a>
        <a href="register.html">Register</a>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="hero-content">
            <button class="get-started-btn" id="getStartedBtn" aria-label="Get started with JaiCare">
                <span class="button-text">Get Started</span>
                <div class="spinner" aria-hidden="true"></div>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const bgDiv = document.getElementById('bgImage');
            const getStartedBtn = document.getElementById('getStartedBtn');

            // Load background image
            const bgPath = 'JaiCarepic.jpg';
            console.log('🔍 Loading background image from:', bgPath);

            const img = new Image();
            img.onload = () => {
                bgDiv.style.backgroundImage = `url('${bgPath}')`;
                console.log('✅ Background image loaded successfully!');
            };
            img.onerror = (err) => {
                console.error('❌ Failed to load background image');
                console.error('   Path:', bgPath);
            };
            img.src = bgPath;

            // Prevent multiple clicks and handle click animation/navigation
            let isClicking = false;
            getStartedBtn.addEventListener('click', (e) => {
                if (isClicking) {
                    e.preventDefault();
                    return;
                }
                isClicking = true;

                // show loading UI
                getStartedBtn.classList.add('loading');

                // small delay to show loading effect then transition
                setTimeout(() => {
                    document.body.classList.add('transition-out');
                    setTimeout(() => {
                        window.location.href = 'register.html';
                    }, 600);
                }, 600);
            });
        });
    </script>
</body>
</html>
