<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - MyApp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            min-height: 100vh;
        }

        /* background image */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* login container on top */
        .login-container { 
            position: relative;
            z-index: 1;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Fade out animation when transitioning */
        body.transition-out {
            animation: fadeOut 0.6s ease-out forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        .login-container h1 { 
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .login-container p { 
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group { 
            margin-bottom: 20px;
        }

        .form-group label { 
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input { 
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus { 
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .message-box { 
            padding: 12px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            animation: slideDown 0.3s;
        }

        .message-box.show { 
            display: block;
        }

        .message-box.error { 
            color: #dc3545;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        .message-box.success { 
            color: #155724;
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }

        @keyframes slideDown { 
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-btn { 
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .login-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .login-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .button-text {
            position: relative;
            z-index: 1;
        }

        .login-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
            pointer-events: none;
        }

        .login-btn.loading .button-text {
            display: none;
        }

        .spinner {
            display: none;
            position: relative;
            z-index: 1;
            width: 20px;
            height: 20px;
        }

        .login-btn.loading .spinner {
            display: block;
        }

        .spinner::after {
            content: '';
            display: block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid white;
            border-color: white transparent white transparent;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .register-link { 
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .register-link a { 
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .register-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        @media (max-width: 420px) {
            .login-container { 
                padding: 24px;
                margin: 12px;
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Background Image -->
    <div class="bg-image" id="bgImage" aria-hidden="true"></div>

    <!-- Login Container -->
    <div class="login-container">
        <h1>JaiCare</h1>
        <p>Sign in to your account</p>

        <div id="statusMessage" class="message-box"></div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required />
        </div>

        <button type="button" class="login-btn" id="loginBtn">
            <span class="button-text">Login</span>
            <div class="spinner"></div>
        </button>

        <div class="register-link">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://moubjbxzopdqwoufpont.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vdWJqYnh6b3BkcXdvdWZwb250Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMzQxMTEsImV4cCI6MjEwMDcxMDExMX0.pmcJWr2yamp--6Zo1Sf2QGfdzBL2Rwri1a70ExlE1U4";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showMessage(el, text, type = 'error') {
            el.textContent = text;
            el.className = `message-box ${type} show`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const statusMessage = document.getElementById('statusMessage');
            const bgDiv = document.getElementById('bgImage');

            // Load background image
            const bgPath = 'JaiCarepic.jpg';
            console.log('🔍 Loading background image from:', bgPath);

            const img = new Image();
            img.onload = () => {
                bgDiv.style.backgroundImage = `url('${bgPath}')`;
                console.log('✅ Background image loaded successfully!');
            };
            img.onerror = (err) => {
                console.error('❌ Failed to load background image');
                console.error('   Path:', bgPath);
            };
            img.src = bgPath;

            // หากมี session อยู่แล้ว ให้ไปหน้า dashboard ทันที
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    window.location.replace('dashboard.html');
                    return;
                }
            } catch (err) {
                console.error('Error checking session on load:', err);
            }

            loginBtn.addEventListener('click', async () => {
                const email = emailInput.value.trim().toLowerCase();
                const password = passwordInput.value;

                if (!email || !password) {
                    showMessage(statusMessage, 'Please fill in all fields', 'error');
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.classList.add('loading');

                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });

                    if (error) {
                        showMessage(statusMessage, error.message || 'Incorrect password or email', 'error');
                        loginBtn.disabled = false;
                        loginBtn.classList.remove('loading');
                    } else if (data && data.session) {
                        showMessage(statusMessage, 'Login Successful! Redirecting...', 'success');
                        setTimeout(() => {
                            document.body.classList.add('transition-out');
                            setTimeout(() => {
                                window.location.href = 'dashboard.html';
                            }, 600);
                        }, 800);
                    } else {
                        showMessage(statusMessage, 'Unable to sign in. Please try again.', 'error');
                        loginBtn.disabled = false;
                        loginBtn.classList.remove('loading');
                    }
                } catch (err) {
                    console.error(err);
                    showMessage(statusMessage, 'An error occurred. Please try again.', 'error');
                    loginBtn.disabled = false;
                    loginBtn.classList.remove('loading');
                }
            });

            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    loginBtn.click();
                }
            });
        });
    </script>
</body>
</html>
