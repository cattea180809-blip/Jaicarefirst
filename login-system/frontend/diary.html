    <style>
        /* (เก็บสไตล์เหมือนเดิมจากต้นฉบับ) */

        html,body{width:100%;height:100%}
        body{
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        .nav-box a,.nav-box button{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:18px 20px;text-decoration:none;color:#333;font-weight:600;font-size:14px;border:none;background:white;cursor:pointer;transition:all .3s}

        /* --- คืนไอคอนเมนูแบบเดิม --- */
        .nav-box a::before {
            content: '';
            display: inline-block;
            width: 24px;
            height: 24px;
            margin-right: 8px;
            background-size: 24px;
            background-repeat: no-repeat;
            background-position: center;
            flex-shrink: 0;

        .nav-box:nth-child(1) a::before {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>');
        }

        .nav-box:nth-child(2) a::before {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>');
        }
        .nav-box:nth-child(3) a::before {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M16 4h-1V2H9v2H8C6.9 4 6 4.9 6 6v2h12V6c0-1.1-.9-2-2-2zm2 6H6v10c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V10zm-3 7H9v-2h6v2z"/></svg>');
        }

        .nav-box:nth-child(4) a::before {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 12H6v-2h14v2zm0-3H6V9h14v2zm0-3H6V6h14v2z"/></svg>');
        }

        .nav-box.logout button::before {
            content: '🚪';

        }

        .center-content{flex:1;display:flex;gap:0;min-height:600px;background:white;border-radius:15px;box-shadow:0 10px 40px rgba(0,0,0,.2);overflow:hidden}
        .diary-left-section{flex:0 0 35%;background:#fff;padding:30px 20px;display:flex;flex-direction:column;align-items:center;border-right:1px solid #e0e0e0;overflow-y:auto}

        .save-button{align-self:flex-start;padding:12px 32px;background:#4CAF50;color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(76,175,80,.25);margin-bottom:25px}

        .newpage-button{padding:10px 14px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer;font-weight:600}
        .nav-buttons { display:flex; gap:8px; align-items:center; }
        .nav-page-btn { padding:8px 12px; border-radius:6px; border:1px solid #ddd; background:#fff; cursor:pointer; font-weight:600; }
        .nav-page-btn.small { padding:6px 8px; font-size:14px; }
        .date-input{padding:10px 16px;font-size:14px;border:2px solid #e0e0e0;border-radius:6px;background:#fff;color:#666;min-width:150px;text-align:center}
        .modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.5);align-items:center;justify-content:center}

        .spinner{border:5px solid rgba(255,255,255,.3);border-top:5px solid #fff;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin-bottom:20px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .hidden{display:none!important}

        /* Grid styles for equal-length boxes (2 columns) */
        .percent-blocks {
          width:100%;
          margin-top:18px;
          display: grid;
          grid-template-columns: repeat(2, 1fr); /* 2 equal columns */
          gap:12px;
          padding-bottom:6px;
          align-items: stretch; /* stretch boxes to equal height */
        }
        /* keep .percent-row wrappers in HTML, but allow grid to place children directly */
        .percent-row { display: contents; }

        .percent-block {
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:12px;
          padding:12px 18px;
          border-radius:12px;
          color:#fff;
          font-weight:600;
          box-shadow:0 6px 20px rgba(0,0,0,.06);
          min-height:56px;
          width:100%;
          box-sizing:border-box;
          transition:transform .12s ease, box-shadow .12s ease;
        }
        .percent-block:hover {
          transform:translateY(-3px);
          box-shadow:0 10px 30px rgba(0,0,0,.08);
        }
        .percent-left { display:flex; align-items:center; gap:12px; min-width:0; }
        .percent-color { width:14px; height:14px; border-radius:4px; flex-shrink:0; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.06); }
        .percent-label { flex:1; font-size:15px; color:rgba(255,255,255,0.95); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .percent-value { width:64px; text-align:right; font-size:15px; font-weight:800; }

        /* responsive: switch to single column on narrow screens */
        @media (max-width:640px) {
          .percent-blocks { grid-template-columns: 1fr; }
          .percent-value { width:48px; }
          .percent-block { min-height:48px; padding:10px 14px; }
        }
    </style>
</head>

   <script>
    const SUPABASE_URL = 'https://moubjbxzopdqwoufpont.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vdWJqYnh6b3BkcXdvdWZwb250Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMzQxMTEsImV4cCI6MjEwMDcxMDExMX0.pmcJWr2yamp--6Zo1Sf2QGfdzBL2Rwri1a70ExlE1U4';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let radarChartInstance = null;

    // Fixed label order (ตามที่ผู้ใช้กำหนด: เริ่มจากบนแล้วตามเข็มนาฬิกา)
    const FORCED_LABEL_ORDER = ['joy','trust','fear','surprise','sadness','disgust','anger','anticipation'];

    // entries list + index ที่แสดงปัจจุบัน + แฟลกแก้ไข
    let entries = []; // array of entry objects from db for selected date
    let currentIndex = -1; // -1 = no selection (new)
    let isEditing = false;

    async function checkAuthentication() {
        try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.replace('index.html');
                return false;
            }
            return true;
        } catch (err) {
            console.error('Error getting session:', err);
            window.location.replace('index.html');
            return false;
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const loadingScreen = document.getElementById('loadingScreen');
        const body = document.body;

        const ok = await checkAuthentication();
        if (!ok) {
            document.body.innerHTML = '';
            return;
        }

        setTimeout(() => {
            if (loadingScreen) loadingScreen.style.display = 'none';
            body.classList.add('authenticated');
            initializeDiary();
        }, 300);

        // สมัครรับการเปลี่ยนแปลงสถานะ (เช่น sign-out จาก tab อื่น)
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (!session) {
                localStorage.clear();
                sessionStorage.clear();
                window.location.replace('index.html');
            }
        });
    });

    function renderRadarChart(emotionsData) {
        const chartContainer = document.getElementById('chartContainer');
        if (!emotionsData || Object.keys(emotionsData).length === 0) {
            chartContainer.classList.add('hidden');
            // hide percent blocks too
            const pb = document.getElementById('percentBlocks');
            if (pb) pb.classList.add('hidden');
            return;
        }
        chartContainer.classList.remove('hidden');
        const ctx = document.getElementById('emotionRadarChart').getContext('2d');
        if (radarChartInstance) radarChartInstance.destroy();

        // use the forced label order and map values into that order (fill missing with 0)
        const labels = FORCED_LABEL_ORDER.slice(); // copy
        const dataValues = labels.map(k => {
            const v = emotionsData[k];
            return (typeof v !== 'undefined' && v !== null) ? Number(v) : 0;
        });

        radarChartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'ระดับอารมณ์',
                    data: dataValues,
                    backgroundColor: 'rgba(102,126,234,0.25)',
                    borderColor: '#667eea',
                    borderWidth: 2,
                    pointBackgroundColor: '#764ba2',
                    pointBorderColor: '#fff',
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: '#764ba2',
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                scales: {
                    r: {
                        angleLines: { color: 'rgba(0,0,0,0.1)' },
                        grid: { color: 'rgba(0,0,0,0.08)' },
                        pointLabels: { font: { size:11, family:"'Sarabun', sans-serif", weight:'600' }, color:'#444' },
                        ticks: { display: false },
                        suggestedMin: 0,
                        suggestedMax: 1
                    }
                },
                plugins: { legend: { display: false } }
            }
        });

        // render percentage blocks under chart using same label order
        renderPercentageBlocks(emotionsData);
    }

    // แปลงค่า primary_emotions ที่อาจมาจาก DB เป็น object ที่ Chart ต้องการ
    function parsePrimaryEmotions(raw) {
        if (!raw) return null;
        // If it's a JSON string from DB, parse it
        if (typeof raw === 'string') {
            try {
                return JSON.parse(raw);
            } catch (e) {
                console.warn('primary_emotions: failed to parse string JSON', e);
                return null;
            }
        }
        // If it's already an object, return as is
        if (typeof raw === 'object') {
            return raw;
        }
        return null;
    }

    // คำนวณเปอร์เซนต์จาก object ของค่าอารมณ์ {happy:0.2, sad:0.1, ...}
    function computePercentages(emotionsObj) {
        if (!emotionsObj || typeof emotionsObj !== 'object') return null;
        const entries = Object.entries(emotionsObj);
        // If all zeros or sum==0, return zeros
        const sum = entries.reduce((s, [, v]) => s + (Number(v) || 0), 0);
        const percentObj = {};
        if (sum === 0) {
            entries.forEach(([k]) => { percentObj[k] = 0; });
            return percentObj;
        }
        entries.forEach(([k, v]) => {
            const n = Number(v) || 0;
            percentObj[k] = Math.round((n / sum) * 100); // integer percent
        });

        // adjust rounding so total = 100 (fix small rounding errors)
        const total = Object.values(percentObj).reduce((s, val) => s + val, 0);
        if (total !== 100) {
            const diff = 100 - total;
            // add diff to the largest value key
            let maxKey = null;
            let maxVal = -Infinity;
            for (const [k, v] of Object.entries(percentObj)) {
                if (v > maxVal) { maxVal = v; maxKey = k; }
            }
            if (maxKey) percentObj[maxKey] = percentObj[maxKey] + diff;
        }

        return percentObj;
    }

    // แสดงบล็อคเปอร์เซนต์เป็นคู่ตามลำดับที่ผู้ใช้ต้องการ
    // คู่: [Joy vs Fear], [Trust vs Anger], [Anticipation vs Sadness], [Surprise vs Disgust]
    // ฟังก์ชันรับทั้งข้อมูล raw (0..1) หรือข้อมูลเปอร์เซนต์ (0..100)
    function renderPercentageBlocks(emotionsData, labelOrder = null) {
        const percentBlocks = document.getElementById('percentBlocks');
        if (!percentBlocks) return;

        if (!emotionsData || Object.keys(emotionsData).length === 0) {
            percentBlocks.classList.add('hidden');
            percentBlocks.innerHTML = '';
            return;
        }

        // Decide whether emotionsData already contains percentages or raw values:
        // if sum >= 100 or any value > 1 treat as percent values, otherwise compute percentages from raw values.
        const rawValues = Object.values(emotionsData).map(v => Number(v) || 0);
        const sumVals = rawValues.reduce((s, a) => s + a, 0);

        let percentObj = {};
        if (sumVals >= 100 || rawValues.some(v => v > 1)) {
            // assume already percent-like -> normalize to integers and fix rounding
            Object.keys(emotionsData).forEach(k => {
                percentObj[k] = Math.round(Number(emotionsData[k]) || 0);
            });
            // adjust to total 100
            const total = Object.values(percentObj).reduce((s, v) => s + v, 0);
            if (total !== 100) {
                const diff = 100 - total;
                // add diff to largest key
                let maxKey = null;
                let maxVal = -Infinity;
                for (const [k, v] of Object.entries(percentObj)) {
                    if (v > maxVal) { maxVal = v; maxKey = k; }
                }
                if (maxKey) percentObj[maxKey] = percentObj[maxKey] + diff;
            }
        } else {
            // compute percentages from raw fractional values
            percentObj = computePercentages(emotionsData) || {};
        }

        // color map — adjust or expand as needed to match chart colors
        const colorMap = {
            'joy': '#FFD166',
            'trust': '#7BE495',
            'anticipation': '#7EB6FF',
            'surprise': '#4CC9F0',
            'fear': '#9D4EDD',
            'anger': '#EF476F',
            'sadness': '#118AB2',
            'disgust': '#F98500',
            'default': '#667eea'
        };

        // fixed pairs requested by user (left, right)
        const pairs = [
            ['joy', 'fear'],
            ['trust', 'anger'],
            ['anticipation', 'sadness'],
            ['surprise', 'disgust']
        ];

        let html = '';
        pairs.forEach(([leftKey, rightKey]) => {
            const leftVal = percentObj[leftKey] !== undefined ? percentObj[leftKey] : 0;
            const rightVal = percentObj[rightKey] !== undefined ? percentObj[rightKey] : 0;

            const leftColor = colorMap[leftKey.toLowerCase()] || colorMap['default'];
            const rightColor = colorMap[rightKey.toLowerCase()] || colorMap['default'];

            const leftLabel = leftKey.charAt(0).toUpperCase() + leftKey.slice(1);
            const rightLabel = rightKey.charAt(0).toUpperCase() + rightKey.slice(1);

            html += `
              <div class="percent-row">
                <div class="percent-block" style="background:${hexToRgba(leftColor,0.88)}">
                  <div class="percent-left">
                    <div class="percent-color" style="background:${leftColor}"></div>
                    <div class="percent-label">${leftLabel}</div>
                  </div>
                  <div class="percent-value">${leftVal}%</div>
                </div>

                <div class="percent-block" style="background:${hexToRgba(rightColor,0.88)}">
                  <div class="percent-left">
                    <div class="percent-color" style="background:${rightColor}"></div>
                    <div class="percent-label">${rightLabel}</div>
                  </div>
                  <div class="percent-value">${rightVal}%</div>
                </div>
              </div>
            `;
        });

        percentBlocks.innerHTML = html;
        percentBlocks.classList.remove('hidden');
    }

    // helper to create RGBA from hex (for better contrast)
    function hexToRgba(hex, alpha=1) {
        try {
            let h = hex.replace('#','');
            if (h.length === 3) h = h.split('').map(c=>c+c).join('');
            const r = parseInt(h.substring(0,2),16);
            const g = parseInt(h.substring(2,4),16);
            const b = parseInt(h.substring(4,6),16);
            return `rgba(${r},${g},${b},${alpha})`;
        } catch (e) {
            return `rgba(102,126,234,${alpha})`;
        }
    }

    function initializeDiary() {
        const logoutBtn = document.getElementById('logoutBtn');
        const saveButton = document.getElementById('saveButton');
        const editButton = document.getElementById('editButton');
        const newPageButton = document.getElementById('newPageButton');
        const diaryTextarea = document.getElementById('diaryTextarea');
        const dateInput = document.getElementById('dateInput');
        const confirmationModal = document.getElementById('confirmationModal');
        const confirmOkButton = document.getElementById('confirmOkButton');
        const confirmCancelButton = document.getElementById('confirmCancelButton');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const deleteButton = document.getElementById('deleteButton');

        const todayStr = new Date().toISOString().split('T')[0];
        dateInput.value = todayStr;

        // ดึง entries ทั้งหมดสำหรับวันที่เลือกและ user ปัจจุบัน
        async function fetchEntriesForDate(selectedDate) {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    window.location.replace('index.html');
                    return;
                }
                const userId = session.user.id;

                const { data, error } = await supabaseClient
                    .from('diary_entries')
                    .select('*')
                    .eq('entry_date', selectedDate)
                    .eq('user_id', userId)
                    .order('created_at', { ascending: true }); // เรียงตามเวลาสร้าง (เก่าสุด -> ใหม่สุด)

                if (error) throw error;

                entries = data || [];

                // ถ้ามี entry ให้แสดงตัวแรกเป็น currentIndex = 0 โดย default
                if (entries.length > 0) {
                    currentIndex = 0;
                    isEditing = false;
                    showEntry(currentIndex);
                } else {
                    // ไม่มี entry ใด ๆ ของวันนั้น ให้เตรียมหน้าว่างสำหรับเพิ่มใหม่
                    currentIndex = -1;
                    isEditing = true; // ให้ผู้ใช้พิมพ์ได้เลย
                    showEmptyEntry();
                }

                updateNavButtons();
            } catch (err) {
                console.error('Error fetching entries:', err);
            }
        }

        // แสดง entry ตาม index (entries[index])
        function showEntry(index) {
            const diaryTextarea = document.getElementById('diaryTextarea');
            const chatContainer = document.getElementById('chatContainer');
            const userChatText = document.getElementById('userChatText');
            const emotionText = document.getElementById('emotionText');
            const aiChatResponse = document.getElementById('aiChatResponse');
            const saveButton = document.getElementById('saveButton');
            const editButton = document.getElementById('editButton');

            if (index < 0 || index >= entries.length) {
                showEmptyEntry();
                return;
            }

            const record = entries[index];
            diaryTextarea.value = record.content || '';

            // If entry is empty, open edit mode immediately
            if (!record.content) {
                diaryTextarea.disabled = false;
                saveButton.classList.remove('hidden');
                editButton.classList.add('hidden');
                isEditing = true;
                chatContainer.classList.add('hidden');
                // hide chart for empty content
                renderRadarChart(null);
            } else {
                diaryTextarea.disabled = true;
                saveButton.classList.add('hidden');
                editButton.classList.remove('hidden');
                isEditing = false;
                userChatText.innerText = record.content || '';
                let displayEmotion = record.dominant_emotion || '-';
                if (record.detected_dyad && record.detected_dyad !== "None") {
                    displayEmotion += ` | ${record.detected_dyad}`;
                }
                emotionText.innerText = displayEmotion;
                aiChatResponse.innerText = record.ai_response || 'ไม่มีคำตอบ';
                chatContainer.classList.remove('hidden');

                // Render the radar chart for THIS entry (if primary_emotions exists)
                const parsed = parsePrimaryEmotions(record.primary_emotions);
                if (parsed) {
                    renderRadarChart(parsed);
                } else {
                    // ถ้าไม่มีค่า ให้ซ่อนกราฟ
                    renderRadarChart(null);
                }

                // If record has percent field, prefer that to avoid recompute rounding differences
                if (record.primary_emotions_percent) {
                    const parsedPercent = parsePrimaryEmotions(record.primary_emotions_percent);
                    if (parsedPercent) {
                        // Build blocks using percent data with forced label order -> our function will detect percent values
                        renderPercentageBlocks(parsedPercent, FORCED_LABEL_ORDER);
                    } else if (parsed) {
                        // fallback compute from parsed raw values (also pass forced order although function uses fixed pairs)
                        const computed = computePercentages(parsed);
                        renderPercentageBlocks(computed, FORCED_LABEL_ORDER);
                    }
                } else if (parsed) {
                    const computed = computePercentages(parsed);
                    renderPercentageBlocks(computed, FORCED_LABEL_ORDER);
                }
            }

            // แสดงปุ่มลบเมื่อมี entry จริง
            deleteButton.classList.remove('hidden');

            updatePageIndicator();
        }

        function showEmptyEntry() {
            const diaryTextarea = document.getElementById('diaryTextarea');
            const chatContainer = document.getElementById('chatContainer');
            const saveButton = document.getElementById('saveButton');
            const editButton = document.getElementById('editButton');
            const deleteButton = document.getElementById('deleteButton');

            diaryTextarea.value = '';
            diaryTextarea.disabled = false;
            diaryTextarea.placeholder = "เริ่มพิมพ์ไดอารี่ของวันที่เลือกตรงนี้ได้เลย...";
            chatContainer.classList.add('hidden');

            saveButton.classList.add('hidden');
            editButton.classList.add('hidden');
            deleteButton.classList.add('hidden');

            isEditing = true;
            // ซ่อนกราฟเมื่อหน้าเป็นหน้าว่าง
            renderRadarChart(null);
            updatePageIndicator();
        }

        function updateNavButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (entries.length <= 1) {
                prevBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
            } else {
                prevBtn.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
            }

            prevBtn.disabled = (currentIndex <= 0);
            nextBtn.disabled = (currentIndex >= entries.length - 1);

            updatePageIndicator();
        }

        function updatePageIndicator() {
            const pageIndicator = document.getElementById('pageIndicator');
            if (entries.length === 0) {
                pageIndicator.style.display = 'none';
            } else {
                pageIndicator.style.display = 'inline';
                const displayIndex = (currentIndex >= 0) ? (currentIndex + 1) : entries.length;
                pageIndicator.innerText = `Page ${displayIndex} / ${entries.length}`;
            }
        }

        // เมื่อเปลี่ยนวันที่ ให้โหลด entries ของวันที่นั้น
        dateInput.addEventListener('change', (e) => {
            fetchEntriesForDate(e.target.value);
        });

        // Prev / Next handlers
        prevBtn.addEventListener('click', () => {
            if (entries.length === 0) return;
            if (currentIndex > 0) {
                currentIndex--;
                showEntry(currentIndex);
                updateNavButtons();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (entries.length === 0) return;
            if (currentIndex < entries.length - 1) {
                currentIndex++;
                showEntry(currentIndex);
                updateNavButtons();
            }
        });

        // New Page -> สร้างแถวเปล่าใน DB ทันที แล้วเปิดโหมดแก้ไข
        if (newPageButton) {
            newPageButton.addEventListener('click', async () => {
                newPageButton.disabled = true;
                try {
                    const selectedDate = dateInput.value || new Date().toISOString().split('T')[0];
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (!session) { window.location.replace('index.html'); return; }
                    const userId = session.user.id;

                    const payload = {
                        entry_date: selectedDate,
                        content: '',
                        user_id: userId
                    };

                    const { data: insertData, error } = await supabaseClient
                        .from('diary_entries')
                        .insert([payload])
                        .select();

                    if (error) {
                        console.error('Error inserting new empty page:', error);
                        alert('ไม่สามารถสร้างหน้าว่างได้ กรุณาลองอีกครั้ง');
                        return;
                    }

                    if (insertData && insertData.length > 0) {
                        entries.push(insertData[0]);
                        currentIndex = entries.length - 1;
                        showEntry(currentIndex);
                        const diaryTextarea = document.getElementById('diaryTextarea');
                        diaryTextarea.disabled = false;
                        diaryTextarea.focus();
                        // save button will appear when user types (input listener)
                        isEditing = true;
                        updateNavButtons();
                    }
                } catch (err) {
                    console.error('Error creating new page:', err);
                    alert('เกิดข้อผิดพลาดขณะสร้างหน้าใหม่');
                } finally {
                    newPageButton.disabled = false;
                }
            });
        }

        // Edit -> เปิด textarea ให้แก้ไข
        if (editButton) {
            editButton.addEventListener('click', () => {
                const diaryTextarea = document.getElementById('diaryTextarea');
                diaryTextarea.disabled = false;
                diaryTextarea.focus();
                editButton.classList.add('hidden');
                document.getElementById('saveButton').classList.remove('hidden');
                isEditing = true;
            });
        }

        // Delete -> ลบ entry ปัจจุบัน
        if (deleteButton) {
            deleteButton.addEventListener('click', async () => {
                if (currentIndex < 0 || !entries[currentIndex] || !entries[currentIndex].id) return;
                const confirmed = confirm('ต้องการลบบันทึกนี้จริงหรือไม่? การกระทำนี้ไม่สามารถย้อนกลับได้');
                if (!confirmed) return;

                try {
                    const entryId = entries[currentIndex].id;
                    const { error } = await supabaseClient
                        .from('diary_entries')
                        .delete()
                        .eq('id', entryId);

                    if (error) {
                        alert('เกิดข้อผิดพลาดในการลบ: ' + error.message);
                        return;
                    }

                    // เอา entry ออกจากรายการ local แล้วปรับ currentIndex
                    entries.splice(currentIndex, 1);
                    if (entries.length === 0) {
                        currentIndex = -1;
                        showEmptyEntry();
                    } else {
                        // ถ้า currentIndexอยู่นอกช่วง ให้ลดลง
                        if (currentIndex >= entries.length) currentIndex = entries.length - 1;
                        showEntry(currentIndex);
                    }

                    updateNavButtons();
                    alert('ลบบันทึกเรียบร้อยแล้ว');
                } catch (err) {
                    console.error('Delete error:', err);
                    alert('เกิดข้อผิดพลาดขณะลบ กรุณาลองใหม่');
                }
            });
        }

        // logout
        if (logoutBtn) {
            logoutBtn.addEventListener('click', async () => {
                try {
                    await supabaseClient.auth.signOut();
                } catch (err) {
                    console.error('Logout error:', err);
                } finally {
                    localStorage.clear();
                    sessionStorage.clear();
                    window.location.replace('index.html');
                }
            });
        }

        // input listener เพื่อแสดงปุ่มบันทึก
        if (diaryTextarea && saveButton) {
            diaryTextarea.addEventListener('input', () => {
                if (!diaryTextarea.disabled && diaryTextarea.value.trim().length > 0) {
                    saveButton.classList.remove('hidden');
                } else {
                    saveButton.classList.add('hidden');
                }
            });
        }

        if (saveButton) {
            saveButton.addEventListener('click', () => {
                if (!dateInput.value) {
                    alert("กรุณาเลือกวันที่ก่อนบันทึกค่ะ");
                    return;
                }
                if (confirmationModal) {
                    confirmationModal.classList.add('show');
                }
            });
        }

        // Confirm OK -> บันทึก (insert หรือ update ขึ้นอยู่กับ currentIndex)
        if (confirmOkButton) {
            confirmOkButton.addEventListener('click', async () => {
                const diaryText = diaryTextarea.value.trim();
                const selectedDate = dateInput.value;

                if (confirmationModal) confirmationModal.classList.remove('show');

                document.getElementById('userChatText').innerText = diaryText;
                document.getElementById('emotionText').innerText = "กำลังวิเคราะห์...";
                document.getElementById('aiChatResponse').innerText = "กำลังประมวลผลคำตอบใหม่จากใจน้า... ⏳";
                document.getElementById('chatContainer').classList.remove('hidden');

                try {
                    // ดึง user id
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (!session) {
                        window.location.replace('index.html');
                        return;
                    }
                    const userId = session.user.id;

                    // เรียก AI วิเคราะห์ (เรียก API ของคุณตามเดิม)
                    const response = await fetch('https://jaicare-backend.onrender.com/analyze', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: diaryText })
                    });

                    const data = await response.json();
                    if (data.error) {
                        document.getElementById('aiChatResponse').innerText = "เกิดข้อผิดพลาดจากระบบ AI: " + data.error;
                        return;
                    }

                    // parse primary emotions raw (could be object or JSON string)
                    const parsedPrimary = parsePrimaryEmotions(data.primary_emotions) || {};

                    // compute percentages from parsed primary emotions
                    const percentObj = computePercentages(parsedPrimary);

                    // เตรียม payload
                    const recordPayload = {
                        entry_date: selectedDate,
                        content: diaryText,
                        ai_response: data.reply_message,
                        dominant_emotion: data.dominant_emotion_th,
                        detected_dyad: data.detected_dyad,
                        primary_emotions: parsedPrimary,
                        primary_emotions_percent: percentObj, // <-- เพิ่มส่งเปอร์เซนต์ไปเก็บ
                        user_id: userId,
                        updated_at: new Date().toISOString()
                    };

                    let dbError;

                    if (currentIndex >= 0 && entries[currentIndex] && entries[currentIndex].id && isEditing) {
                        // UPDATE แถวที่เลือก (ใช้ id)
                        const entryId = entries[currentIndex].id;
                        const { error } = await supabaseClient
                            .from('diary_entries')
                            .update(recordPayload)
                            .eq('id', entryId);
                        dbError = error;

                        if (!dbError) {
                            // อัปเดต entry ใน memory แล้วแสดงอีกครั้ง
                            entries[currentIndex] = {
                                ...entries[currentIndex],
                                ...recordPayload
                            };
                        }
                    } else {
                        // INSERT ใหม่ (สร้างหน้าใหม่)
                        const { data: insertData, error } = await supabaseClient
                            .from('diary_entries')
                            .insert([recordPayload])
                            .select(); // select เพื่อให้ได้ข้อมูลที่เพิ่ง insert กลับมา
                        dbError = error;

                        if (!dbError && insertData && insertData.length > 0) {
                            // เพิ่มเข้า entries array และตั้ง currentIndex เป็นอันสุดท้าย
                            entries.push(insertData[0]);
                            currentIndex = entries.length - 1;
                        }
                    }

                    if (dbError) {
                        alert("เกิดข้อผิดพลาดในการบันทึกลงฐานข้อมูล: " + dbError.message);
                        return;
                    }

                    // แสดงผลหลังบันทึก
                    let displayEmotion = data.dominant_emotion_th;
                    if (data.detected_dyad && data.detected_dyad !== "None") {
                        displayEmotion += ` | ${data.detected_dyad}`;
                    }

                    document.getElementById('emotionText').innerText = displayEmotion;
                    document.getElementById('aiChatResponse').innerText = data.reply_message;

                    // Render chart for this saved entry (use parsedPrimary)
                    renderRadarChart(parsedPrimary);

                    diaryTextarea.disabled = true;
                    document.getElementById('saveButton').classList.add('hidden');
                    document.getElementById('editButton').classList.remove('hidden');

                    updateNavButtons();

                    alert(`🎉 บันทึก/แก้ไข ไดอารี่ประจำวันที่ ${selectedDate} เรียบร้อยแล้วค่ะ!`);
                } catch (error) {
                    console.error('Error connecting to AI or Supabase:', error);
                    document.getElementById('aiChatResponse').innerText = "ไม่สามารถติดต่อเซิร์ฟเวอร์ AI ได้ในขณะนี้ค่ะ";
                }
            });
        }

        if (confirmCancelButton) {
            confirmCancelButton.addEventListener('click', () => {
                if (confirmationModal) confirmationModal.classList.remove('show');
            });
        }

        if (confirmationModal) {
            confirmationModal.addEventListener('click', (e) => {
                if (e.target === confirmationModal) confirmationModal.classList.remove('show');
            });
        }

        // โหลด entries ของวันนี้ตอนเริ่ม
        fetchEntriesForDate(todayStr);
    }
</script>
