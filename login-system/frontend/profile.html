<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile - Mood Analysis Diary</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: url("./JaiCarepic.jpg") center center / cover no-repeat fixed;
      min-height: 100vh;
      padding: 20px;
      opacity: 1;
    }

    .dashboard-wrapper {
      display: flex;
      gap: 30px;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      align-items: flex-start;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 220px;
      flex-shrink: 0;
    }

    .nav-box {
      background: white;
      border-radius: 10px;
      padding: 0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-box a, .nav-box button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 18px 20px;
      text-decoration: none;
      color: #333;
      font-weight: 600;
      font-size: 14px;
      border: none;
      background: white;
      cursor: pointer;
      transition: all 0.3s;
    }

    .nav-box a:hover, .nav-box button:hover {
      background: #667eea;
      color: white;
      transform: translateX(5px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
    }

    .nav-box.logout button {
      background: #dc3545;
      color: white;
    }

    .nav-box a::before {
      content: '';
      display: inline-block;
      width: 24px;
      height: 24px;
      margin-right: 8px;
      background-size: 24px;
      background-repeat: no-repeat;
      background-position: center;
      flex-shrink: 0;
    }

    .nav-box:nth-child(1) a::before {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23333333"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>');
    }

    .nav-box:nth-child(2) a::before {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23333333"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>');
    }

    .nav-box:nth-child(3) a::before {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23333333"><path d="M16 4h-1V2H9v2H8C6.9 4 6 4.9 6 6v2h12V6c0-1.1-.9-2-2-2zm2 6H6v10c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V10zm-3 7H9v-2h6v2z"/></svg>');
    }

    .nav-box:nth-child(4) a::before {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23333333"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 12H6v-2h14v2zm0-3H6V9h14v2zm0-3H6V6h14v2z"/></svg>');
    }

    .nav-box a:hover::before { filter: brightness(0) invert(1); }
    .nav-box.logout button::before { content: '🚪'; margin-right: 8px; font-size: 20px; }

    .center-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 600px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.88);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(3px);
    }

    .profile-wrap {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .profile-card {
      flex: 0 0 320px;
      background: linear-gradient(180deg, #ffffff, #fbfbff);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-frame {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      background: #f0f4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 6px solid rgba(102, 126, 234, 0.12);
      margin-bottom: 16px;
      position: relative;
    }

    .avatar-frame img {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #667eea;
    }

    .avatar-placeholder svg {
      width: 70px;
      height: 70px;
      fill: currentColor;
    }

    .avatar-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn {
      background: #667eea;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      border: 0;
      cursor: pointer;
      font-weight: 600;
    }

    .btn:hover { filter: brightness(0.96); }

    .btn.secondary {
      background: #f0f0f0;
      color: #333;
      border: 1px solid #e6e6e6;
      box-shadow: none;
    }

    .info-card {
      flex: 1 1 540px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field {
      background: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 13px;
      color: #666;
      font-weight: 600;
    }

    input[type="text"], input[type="email"] {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 15px;
      width: 100%;
    }

    .actions {
      margin-top: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .stats {
      margin-top: 22px;
      text-align: center;
      padding: 14px;
      border-radius: 10px;
      background: linear-gradient(90deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.03));
      color: #333;
      font-weight: 700;
    }

    .upload-msg {
      min-height: 18px;
      font-size: 13px;
      margin-top: 8px;
      color: #555;
      text-align: center;
    }

    .small-muted {
      font-size: 13px;
      color: #888;
      margin-top: 6px;
    }

    @media (max-width: 880px) {
      .dashboard-wrapper {
        flex-direction: column;
        align-items: center;
      }
      .sidebar {
        order: 2;
        width: 100%;
        max-width: 500px;
      }
      .center-content {
        order: 1;
        width: 100%;
        min-height: 0;
      }
      .container {
        padding: 18px;
      }
      .profile-card {
        flex: 1 1 100%;
      }
    }
  </style>
</head>

<body>
  <div class="dashboard-wrapper">
    <aside class="sidebar" aria-hidden="false">
      <div class="nav-box"><a href="dashboard.html">Main Page</a></div>
      <div class="nav-box"><a href="profile.html">User Profile</a></div>
      <div class="nav-box"><a href="Radar Chart.html">Radar Chart</a></div>
      <div class="nav-box"><a href="feedback.html">Feedback</a></div>
      <div class="nav-box logout">
        <button id="logoutSidebarBtn" type="button">Logout</button>
      </div>
    </aside>

    <main class="center-content">
      <div class="container" role="main">
        <h2 style="margin-bottom: 14px; color: #333;">โปรไฟล์ของฉัน</h2>

        <div class="profile-wrap">
          <section class="profile-card" aria-label="รูปโปรไฟล์">
            <div class="avatar-frame">
              <div class="avatar-placeholder" id="avatarPlaceholder" aria-hidden="true">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
              </div>
              <img id="avatarImage" alt="รูปโปรไฟล์" />
            </div>

            <div style="width:100%; text-align:center;">
              <label for="avatarFile">เลือกรูปโปรไฟล์</label>

              <input id="avatarFile" type="file" accept="image/*" hidden />

              <div class="avatar-actions">
                <button id="chooseAvatarBtn" class="btn" type="button">เลือกรูปภาพ</button>
                <button id="removeAvatarBtn" class="btn secondary" type="button">ลบรูป</button>
              </div>

              <div class="upload-msg" id="uploadMsg" role="status" aria-live="polite">
                เลือกรูปภาพ JPG, PNG หรือ WEBP ขนาดไม่เกิน 2 MB
              </div>
            </div>
          </section>

          <section class="info-card" aria-labelledby="infoTitle">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
              <h3 id="infoTitle" style="color:#333;">ข้อมูลผู้ใช้</h3>
              <button id="logoutBtn" class="btn secondary" type="button">ออกจากระบบ</button>
            </div>

            <div class="field">
              <label for="nicknameInput">ชื่อเล่น</label>
              <input id="nicknameInput" type="text" placeholder="ชื่อเล่น" />
            </div>

            <div class="field">
              <label for="emailInput">อีเมล</label>
              <input id="emailInput" type="email" disabled />
            </div>

            <div class="actions">
              <button id="saveProfileBtn" class="btn" type="button">บันทึกข้อมูลโปรไฟล์</button>
              <div id="saveStatus" class="small-muted" role="status" aria-live="polite"></div>
            </div>

            <div class="stats">
              <div>จำนวนบันทึก</div>
              <div id="entryCount" style="font-size: 22px; margin-top: 6px;">0</div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://moubjbxzopdqwoufpont.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vdWJqYnh6b3BkcXdvdWZwb250Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMzQxMTEsImV4cCI6MjEwMDcxMDExMX0.pmcJWr2yamp--6Zo1Sf2QGfdzBL2Rwri1a70ExlE1U4';

    document.addEventListener('DOMContentLoaded', async () => {
      let supabaseClient = null;

      try {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
      } catch (error) {
        console.error('Error initializing Supabase client:', error);
      }

      const avatarFile = document.getElementById('avatarFile');
      const avatarImage = document.getElementById('avatarImage');
      const avatarPlaceholder = document.getElementById('avatarPlaceholder');
      const chooseAvatarBtn = document.getElementById('chooseAvatarBtn');
      const removeAvatarBtn = document.getElementById('removeAvatarBtn');
      const uploadMsg = document.getElementById('uploadMsg');

      const nicknameInput = document.getElementById('nicknameInput');
      const emailInput = document.getElementById('emailInput');
      const saveProfileBtn = document.getElementById('saveProfileBtn');
      const saveStatus = document.getElementById('saveStatus');
      const entryCountEl = document.getElementById('entryCount');

      const logoutBtn = document.getElementById('logoutBtn');
      const logoutSidebarBtn = document.getElementById('logoutSidebarBtn');

      let currentUser = null;

      function avatarStorageKey(userId) {
        return `profileAvatar_${userId}`;
      }

      function showAvatar(dataUrl) {
        if (dataUrl) {
          avatarImage.src = dataUrl;
          avatarImage.style.display = 'block';
          avatarPlaceholder.style.display = 'none';
        } else {
          avatarImage.removeAttribute('src');
          avatarImage.style.display = 'none';
          avatarPlaceholder.style.display = 'flex';
        }
      }

      function loadSavedAvatar() {
        if (!currentUser) {
          showAvatar(null);
          return;
        }

        try {
          const savedAvatar = localStorage.getItem(avatarStorageKey(currentUser.id));
          showAvatar(savedAvatar);
        } catch (error) {
          console.error('Unable to load saved profile image:', error);
          showAvatar(null);
        }
      }

      chooseAvatarBtn.addEventListener('click', () => {
        avatarFile.click();
      });

      avatarFile.addEventListener('change', () => {
        const file = avatarFile.files && avatarFile.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          uploadMsg.textContent = 'กรุณาเลือกไฟล์รูปภาพ';
          avatarFile.value = '';
          return;
        }

        const maxFileSize = 2 * 1024 * 1024;
        if (file.size > maxFileSize) {
          uploadMsg.textContent = 'รูปมีขนาดใหญ่เกินไป กรุณาเลือกไฟล์ไม่เกิน 2 MB';
          avatarFile.value = '';
          return;
        }

        const reader = new FileReader();

        reader.onload = () => {
          try {
            localStorage.setItem(avatarStorageKey(currentUser.id), reader.result);
            showAvatar(reader.result);
            uploadMsg.textContent = 'เปลี่ยนรูปโปรไฟล์เรียบร้อยแล้ว';
          } catch (error) {
            console.error('Unable to save profile image:', error);
            uploadMsg.textContent = 'บันทึกรูปไม่ได้ กรุณาลองใช้รูปที่มีขนาดเล็กลง';
          }
        };

        reader.onerror = () => {
          uploadMsg.textContent = 'อ่านไฟล์รูปไม่สำเร็จ กรุณาลองอีกครั้ง';
        };

        reader.readAsDataURL(file);
      });

      removeAvatarBtn.addEventListener('click', () => {
        if (currentUser) {
          try {
            localStorage.removeItem(avatarStorageKey(currentUser.id));
          } catch (error) {
            console.error('Unable to remove saved profile image:', error);
          }
        }

        avatarFile.value = '';
        showAvatar(null);
        uploadMsg.textContent = 'ลบรูปโปรไฟล์แล้ว';
      });

      async function saveProfileData() {
        if (!supabaseClient || !currentUser) {
          alert('ต้องล็อกอินเพื่อบันทึกข้อมูล');
          return;
        }

        const payload = {
          user_id: currentUser.id,
          nickname: nicknameInput.value.trim() || null,
          email: currentUser.email || null,
          updated_at: new Date().toISOString()
        };

        try {
          const { error } = await supabaseClient
            .from('profiles')
            .upsert([payload], { onConflict: 'user_id' });

          if (error) throw error;

          saveStatus.textContent = 'บันทึกเรียบร้อย';
          setTimeout(() => {
            saveStatus.textContent = '';
          }, 1800);

          await loadProfileAndStats();
        } catch (error) {
          console.error('Error saving profile:', error);
          alert('เกิดข้อผิดพลาดขณะบันทึกข้อมูล');
        }
      }

      saveProfileBtn.addEventListener('click', saveProfileData);

      async function signOutAndRedirect() {
        try {
          if (supabaseClient) {
            await supabaseClient.auth.signOut();
          }
        } catch (error) {
          console.error('Sign out error:', error);
        }

        window.location.replace('index.html');
      }

      logoutBtn.addEventListener('click', signOutAndRedirect);
      logoutSidebarBtn.addEventListener('click', signOutAndRedirect);

      async function checkAuth() {
        if (!supabaseClient) {
          alert('เชื่อมต่อระบบไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
          return null;
        }

        try {
          const { data, error } = await supabaseClient.auth.getSession();
          if (error) throw error;

          if (!data || !data.session) {
            window.location.replace('index.html');
            return null;
          }

          return data.session.user;
        } catch (error) {
          console.error('Auth error:', error);
          window.location.replace('index.html');
          return null;
        }
      }

      async function loadProfileAndStats() {
        currentUser = await checkAuth();

        if (!currentUser) {
          showAvatar(null);
          return;
        }

        emailInput.value = currentUser.email || '';
        loadSavedAvatar();

        try {
          const { data, error } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('user_id', currentUser.id)
            .limit(1);

          if (error) {
            console.error('Error loading profile:', error);
          } else if (data && data.length > 0) {
            nicknameInput.value = data[0].nickname || '';
          } else {
            nicknameInput.value = '';
          }
        } catch (error) {
          console.error('Error reading profile:', error);
        }

        try {
          const { data, error } = await supabaseClient
            .from('diary_entries')
            .select('id')
            .eq('user_id', currentUser.id);

          if (error) throw error;

          entryCountEl.textContent = data ? data.length : 0;
        } catch (error) {
          console.error('Error fetching diary count:', error);
          entryCountEl.textContent = '0';
        }
      }

      await loadProfileAndStats();
    });
  </script>
</body>
</html>
